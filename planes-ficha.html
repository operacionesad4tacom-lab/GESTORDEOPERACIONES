<script>
let ctx = null;
let plan = null;
let unidades = [];
const params = new URLSearchParams(location.search);
const { esc, val, NE } = PO;

const nombreUnidad = id => unidades.find(u => u.id === id)?.sigla || '';
const opcionesUnidades = () => Object.fromEntries(unidades.map(u => [u.id, u.nombre]));
const opcionesEtapas = () => Object.fromEntries((plan?.etapas || []).map(e => [e.id, e.nombre]));
const btnAdmin = (txt, fn, cls = 'btn-link') => `<button class="${cls} po-solo-admin" onclick="${fn}">${txt}</button>`;

// ─── Datos generales ──────────────────────────────
const ETIQUETAS = {
  tipo: 'Tipo', numero: 'N° de plan', titulo: 'Título', emisor: 'Emisor', emisor_detalle: 'Detalle del emisor',
  fecha_emision: 'Fecha de emisión', mision: 'Misión', inicio: 'Inicio', termino: 'Término',
  hasta_nueva_orden: 'Hasta nueva orden', recurrencia: 'Recurrencia', jefe_servicio: 'Jefe de servicio',
  supervisor: 'Supervisor / fiscalizador', prioridad: 'Prioridad', personal_total_declarado: 'Personal total declarado',
  plan_asociado_id: 'Plan asociado', observaciones: 'Observaciones',
};

function textoCampo(k, v) {
  if (v === null || v === undefined || v === '') return 'No especificado';
  if (k === 'tipo') return PO.TIPOS[v];
  if (k === 'emisor') return PO.EMISORES[v];
  if (k === 'prioridad') return PO.PRIORIDADES[v];
  if (k === 'inicio' || k === 'termino') return PO.fFechaHora(v);
  if (k === 'fecha_emision') return PO.fFecha(v);
  if (k === 'hasta_nueva_orden') return v ? 'Sí' : 'No';
  return String(v);
}

async function camposGenerales({ conNcu = false, ncuObligatorio = false } = {}) {
  const { data: otros } = await SIGO.db.from('po_planes').select('id, numero, titulo')
    .eq('es_plantilla', false).neq('id', plan?.id || '00000000-0000-0000-0000-000000000000').order('titulo');
  const campos = [];
  if (conNcu) {
    campos.push(
      { k: '_t1', tipo: 'html', html: '<div class="po-subtitulo">Documento (DOE)</div>' },
      { k: 'ncu', label: ncuObligatorio ? 'NCU *' : 'NCU de origen', ancho: 'third', placeholder: 'Ej.: 264753566' },
      { k: 'ncu_fecha', label: 'Fecha del DOE', tipo: 'date', ancho: 'third' },
      { k: 'ncu_resumen', label: 'Resumen', ancho: 'third', placeholder: 'Qué instruye o modifica' },
      { k: '_t2', tipo: 'html', html: '<div class="po-subtitulo">Datos del plan</div>' },
    );
  }
  campos.push(
    { k: 'titulo', label: 'Título *', ancho: 'full' },
    { k: 'tipo', label: 'Tipo', tipo: 'select', opciones: PO.TIPOS, vacio: false, ancho: 'third' },
    { k: 'numero', label: 'N° de plan', ancho: 'third' },
    { k: 'prioridad', label: 'Prioridad', tipo: 'select', opciones: PO.PRIORIDADES, vacio: false, ancho: 'third' },
    { k: 'emisor', label: 'Emisor', tipo: 'select', opciones: PO.EMISORES, ancho: 'third' },
    { k: 'emisor_detalle', label: 'Detalle del emisor', ancho: 'third' },
    { k: 'fecha_emision', label: 'Fecha de emisión', tipo: 'date', ancho: 'third' },
    { k: 'mision', label: 'Misión', tipo: 'textarea', filas: 2 },
    { k: 'inicio', label: 'Inicio (fecha y hora)', tipo: 'datetime', ancho: 'half' },
    { k: 'termino', label: 'Término (fecha y hora)', tipo: 'datetime', ancho: 'half' },
    { k: 'hasta_nueva_orden', tipo: 'check', textoCheck: 'Vigente hasta nueva orden', ancho: 'half' },
    { k: 'recurrencia', label: 'Recurrencia', ancho: 'half', placeholder: 'Ej.: lunes y martes, 2 semanas al mes' },
    { k: 'jefe_servicio', label: 'Jefe de servicio', ancho: 'half' },
    { k: 'supervisor', label: 'Supervisor / fiscalizador', ancho: 'half' },
    { k: 'personal_total_declarado', label: 'Personal total declarado', tipo: 'number', ancho: 'half',
      ayuda: 'Total que indica el documento, aunque no venga desglosado' },
    { k: 'plan_asociado_id', label: 'Plan asociado (eventos en preparación)', tipo: 'select', ancho: 'half',
      vacio: '— Sin plan asociado —',
      opciones: Object.fromEntries((otros || []).map(p => [p.id, `${p.numero ? 'N°' + p.numero + ' · ' : ''}${p.titulo}`])) },
    { k: 'observaciones', label: 'Observaciones', tipo: 'textarea', filas: 3 },
  );
  return campos;
}

const CLAVES_GENERALES = Object.keys(ETIQUETAS);

// Compara valores de la BD con los del formulario (fechas como instantes, no como texto)
function mismoValor(k, a, b) {
  if (k === 'hasta_nueva_orden') return !!a === !!b;
  const vacio = v => v === null || v === undefined || v === '';
  if (vacio(a) || vacio(b)) return vacio(a) && vacio(b);
  if (k === 'inicio' || k === 'termino') return new Date(a).getTime() === new Date(b).getTime();
  return String(a) === String(b);
}
const soloGenerales = v => Object.fromEntries(CLAVES_GENERALES.map(k => [k, v[k] ?? (k === 'hasta_nueva_orden' ? false : null)]));

function validarGenerales(v) {
  if (!v.titulo) throw new Error('El título es obligatorio.');
  if (v.inicio && v.termino && v.termino < v.inicio) throw new Error('El término no puede ser anterior al inicio.');
}

// Nuevo plan (formulario manual)
async function formularioNuevo() {
  PO.abrirFormulario({
    titulo: 'Nuevo plan (ingreso manual)',
    ancho: 820,
    intro: `<div class="alert alert-info" style="font-size:12.5px;"><span>El plan queda en la bandeja <strong>Por revisar</strong>
      y no genera alertas de servicio hasta que se confirme. Lo que el documento no indique, déjelo en blanco: quedará como
      “No especificado”.</span></div>`,
    campos: await camposGenerales({ conNcu: true }),
    valores: { tipo: 'orden_doe', prioridad: 'normal' },
    textoGuardar: 'Crear plan',
    alGuardar: async v => {
      validarGenerales(v);
      const dup = await PO.buscarDuplicados({ ncus: [v.ncu], numero: v.numero, emisor: v.emisor });
      if (dup.length) {
        const d = dup[0];
        const r = await PO.elegir({
          titulo: 'Posible duplicado',
          mensaje: `<p style="margin-bottom:8px;">${esc(d.motivo)}:</p>
            <p><strong>${d.numero ? 'N°' + esc(d.numero) + ' · ' : ''}${esc(d.titulo)}</strong></p>
            <p class="text-sm text-muted" style="margin-top:10px;">Si este documento modifica o complementa ese plan, regístrelo como adición.</p>`,
          opciones: [
            { k: 'adicion', texto: '➕ Agregar como adición', clase: 'btn-primary' },
            { k: 'crear', texto: 'Crear plan nuevo igualmente' },
            { k: 'cancelar', texto: 'Cancelar' },
          ],
        });
        if (!r) return false;
        if (r === 'adicion') {
          const q = new URLSearchParams({ id: d.id, adicion: '1', ncu: v.ncu || '', fecha: v.ncu_fecha || '', resumen: v.ncu_resumen || '' });
          location.href = `planes-ficha.html?${q}`;
          return false;
        }
      }
      const nuevo = await PO.guardar('po_planes', { ...soloGenerales(v), revision: 'por_revisar', creado_por: ctx.user.id });
      if (v.ncu) {
        await PO.guardar('po_ncu', { plan_id: nuevo.id, ncu: v.ncu, fecha: v.ncu_fecha, resumen: v.ncu_resumen, es_origen: true });
      }
      location.replace(`planes-ficha.html?id=${nuevo.id}`);
    },
  });
}

async function editarGenerales() {
  PO.abrirFormulario({
    titulo: 'Editar datos del plan', ancho: 820,
    campos: await camposGenerales(),
    valores: plan,
    alGuardar: async v => {
      validarGenerales(v);
      await PO.guardar('po_planes', { id: plan.id, ...soloGenerales(v) });
      await recargar();
    },
  });
}

// Adición: nuevo DOE que modifica el plan; guarda antes/después
async function registrarAdicion(pre = {}) {
  PO.abrirFormulario({
    titulo: 'Registrar adición (nuevo DOE)', ancho: 820,
    intro: `<div class="po-banner adicion">ℹ️ Modifique solo los datos que cambia el nuevo DOE. Los cambios quedarán en el
      historial del NCU (antes → después). Facciones, servicios y plazos se ajustan después en la ficha.</div>`,
    campos: await camposGenerales({ conNcu: true, ncuObligatorio: true }),
    valores: { ...plan, ncu: pre.ncu || '', ncu_fecha: pre.fecha || '', ncu_resumen: pre.resumen || '' },
    textoGuardar: 'Registrar adición',
    alGuardar: async v => {
      if (!v.ncu) throw new Error('Indique el NCU del nuevo DOE.');
      if (plan.ncu.some(n => n.ncu === v.ncu)) throw new Error(`El NCU ${v.ncu} ya está registrado en este plan.`);
      validarGenerales(v);
      const nuevos = soloGenerales(v);
      const cambios = CLAVES_GENERALES
        .filter(k => !mismoValor(k, plan[k], nuevos[k]))
        .map(k => ({ campo: ETIQUETAS[k], antes: textoCampo(k, plan[k]), despues: textoCampo(k, nuevos[k]) }));
      if (cambios.length) await PO.guardar('po_planes', { id: plan.id, ...nuevos });
      await PO.guardar('po_ncu', {
        plan_id: plan.id, ncu: v.ncu, fecha: v.ncu_fecha, resumen: v.ncu_resumen, cambios: cambios.length ? cambios : null,
      });
      history.replaceState(null, '', `planes-ficha.html?id=${plan.id}`);
      SIGO.showToast(cambios.length ? `✅ Adición registrada (${cambios.length} cambio${cambios.length > 1 ? 's' : ''})` : '✅ Adición registrada sin cambios en datos generales');
      await recargar();
    },
  });
}

// ─── Acciones del plan ────────────────────────────
async function confirmarPlan() {
  const pend = plan.contradicciones.filter(c => !c.resuelta).length;
  const r = await PO.elegir({
    titulo: 'Confirmar plan',
    mensaje: `<p>Al confirmar, el plan se activa: aparece en las vistas y genera alertas de servicio.</p>
      ${pend ? `<div class="alert alert-warning" style="margin-top:12px;">⚠️ Tiene ${pend} contradicción${pend > 1 ? 'es' : ''} sin resolver.
      Quedarán marcadas para revisión.</div>` : ''}`,
    opciones: [{ k: 'si', texto: '✅ Confirmar', clase: 'btn-primary' }, { k: 'cancelar', texto: 'Cancelar' }],
  });
  if (!r) return;
  await PO.guardar('po_planes', { id: plan.id, revision: 'confirmado', confirmado_por: ctx.user.id, confirmado_en: new Date().toISOString() });
  SIGO.showToast('✅ Plan confirmado');
  await recargar();
}

async function guardarPlantilla() {
  const p = await PO.copiarPlan(plan.id, { comoPlantilla: true, userId: ctx.user.id });
  SIGO.showToast('📄 Plantilla guardada');
  setTimeout(() => { location.href = `planes-ficha.html?id=${p.id}`; }, 800);
}

async function alternarCierre() {
  const cerrar = !plan.cerrado;
  if (!confirm(cerrar ? '¿Cerrar este plan? Dejará de generar alertas.' : '¿Reabrir este plan?')) return;
  await PO.guardar('po_planes', cerrar
    ? { id: plan.id, cerrado: true, cerrado_por: ctx.user.id, cerrado_en: new Date().toISOString() }
    : { id: plan.id, cerrado: false, cerrado_por: null, cerrado_en: null });
  await recargar();
}

async function eliminarPlan() {
  if (!confirm(`¿Eliminar definitivamente "${plan.titulo}"?\nQuedará registro en la auditoría.`)) return;
  await PO.borrar('po_planes', plan.id);
  location.replace('planes.html');
}

// ─── CRUD de tablas hijas ─────────────────────────
async function borrarFila(tabla, id, texto) {
  if (!confirm(`¿Eliminar ${texto}?`)) return;
  try { await PO.borrar(tabla, id); await recargar(); }
  catch (e) { SIGO.showToast('❌ ' + e.message, 'warning'); }
}

function editarNcu(id) {
  const n = plan.ncu.find(x => x.id === id) || {};
  PO.abrirFormulario({
    titulo: id ? 'Editar NCU' : 'Agregar NCU relacionado',
    campos: [
      { k: 'ncu', label: 'NCU *', ancho: 'half' },
      { k: 'fecha', label: 'Fecha', tipo: 'date', ancho: 'half' },
      { k: 'resumen', label: 'Resumen', tipo: 'textarea', filas: 2 },
      { k: 'es_origen', tipo: 'check', textoCheck: 'Es el NCU de origen' },
    ],
    valores: n,
    alGuardar: async v => {
      if (!v.ncu) throw new Error('El NCU es obligatorio.');
      await PO.guardar('po_ncu', { id: id || undefined, plan_id: plan.id, ...v });
      await recargar();
    },
  });
}

function editarEtapa(id) {
  const e = plan.etapas.find(x => x.id === id) || { orden: plan.etapas.length + 1 };
  PO.abrirFormulario({
    titulo: id ? 'Editar etapa' : 'Nueva etapa',
    campos: [
      { k: 'nombre', label: 'Nombre *', ancho: 'half' },
      { k: 'orden', label: 'Orden', tipo: 'number', ancho: 'half' },
      { k: 'inicio', label: 'Inicio', tipo: 'datetime', ancho: 'half' },
      { k: 'termino', label: 'Término', tipo: 'datetime', ancho: 'half' },
      { k: 'lugar', label: 'Lugar' },
      { k: 'tactica', label: 'Táctica', tipo: 'textarea', filas: 2 },
    ],
    valores: e,
    alGuardar: async v => {
      if (!v.nombre) throw new Error('El nombre es obligatorio.');
      await PO.guardar('po_etapas', { id: id || undefined, plan_id: plan.id, ...v, orden: v.orden ?? 0 });
      await recargar();
    },
  });
}

function editarFaccion(id) {
  const f = plan.facciones.find(x => x.id === id) || { orden: plan.facciones.length + 1, apoyo_instituciones: [] };
  const campos = [
    { k: 'nombre', label: 'Nombre *', ancho: 'half', placeholder: 'Ej.: Punto de Control N°1' },
    { k: 'lugar', label: 'Lugar', ancho: 'half', placeholder: 'Complejo, ruta y km, paso, localidad' },
    { k: 'unidad_cargo_id', label: 'Unidad / destacamento a cargo', tipo: 'select', opciones: opcionesUnidades(), ancho: 'half' },
    { k: 'jefe_faccion', label: 'Jefe de facción', ancho: 'half' },
  ];
  if (plan.etapas.length) campos.push({ k: 'etapa_id', label: 'Etapa', tipo: 'select', opciones: opcionesEtapas(), vacio: '— Sin etapa —', ancho: 'half' });
  campos.push(
    { k: 'orden', label: 'Orden', tipo: 'number', ancho: plan.etapas.length ? 'half' : 'full' },
    { k: 'apoyo_instituciones', label: 'Apoyo de otras instituciones', tipo: 'multi', opciones: PO.INSTITUCIONES },
    { k: 'apoyo_detalle', label: 'Detalle del apoyo', placeholder: 'Ej.: PDI y SEBV; contacto…' },
    { k: 'observaciones', label: 'Observaciones', tipo: 'textarea', filas: 2 },
  );
  PO.abrirFormulario({
    titulo: id ? 'Editar facción / punto de control' : 'Nueva facción / punto de control', ancho: 720,
    campos, valores: f,
    alGuardar: async v => {
      if (!v.nombre) throw new Error('El nombre es obligatorio.');
      await PO.guardar('po_facciones', { id: id || undefined, plan_id: plan.id, ...v, orden: v.orden ?? 0 });
      await recargar();
    },
  });
}

function editarRecurso(faccionId, id) {
  const f = plan.facciones.find(x => x.id === faccionId);
  const r = f.recursos.find(x => x.id === id) || {};
  PO.abrirFormulario({
    titulo: `${id ? 'Editar' : 'Agregar'} recursos · ${f.nombre}`, ancho: 760,
    intro: '<p class="text-sm text-muted" style="margin-bottom:10px;">Deje en blanco lo que el documento no indica (queda “No especificado”). Use 0 solo si el documento dice explícitamente cero.</p>',
    campos: [
      { k: 'unidad_id', label: 'Unidad', tipo: 'select', opciones: opcionesUnidades() },
      { k: '_g', tipo: 'html', html: '<div class="po-subtitulo">Personal por grado</div>' },
      ...PO.GRADOS.map(([k, l]) => ({ k, label: l, tipo: 'number', ancho: 'sixth' })),
      { k: '_m', tipo: 'html', html: '<div class="po-subtitulo">Medios logísticos</div>' },
      ...PO.MEDIOS.map(([k, l]) => ({ k, label: l, tipo: 'number', ancho: 'sixth' })),
      { k: 'nota', label: 'Nota', placeholder: 'Ej.: cantidad según anexo' },
    ],
    valores: r,
    alGuardar: async v => {
      await PO.guardar('po_recursos', { id: id || undefined, plan_id: plan.id, faccion_id: faccionId, ...v });
      await recargar();
    },
  });
}

// Generador de servicios: fechas sueltas o rango + horario (crea una fila por fecha)
function agregarServicios(faccionId) {
  const f = faccionId ? plan.facciones.find(x => x.id === faccionId) : null;
  const campos = [
    { k: 'modo', label: 'Fechas', tipo: 'select', vacio: false, opciones: { sueltas: 'Fechas sueltas', rango: 'Rango de fechas' }, ancho: 'full' },
    { k: 'fechas', label: 'Fechas sueltas (dd.mm.aaaa)', tipo: 'textarea', filas: 2, placeholder: '19.10.2026, 20.10.2026' },
    { k: 'desde', label: 'Desde', tipo: 'date', ancho: 'third' },
    { k: 'hasta', label: 'Hasta', tipo: 'date', ancho: 'third' },
    { k: 'dias', label: 'Solo estos días (vacío = todos)', tipo: 'multi', opciones: ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], ancho: 'third' },
    { k: '_h', tipo: 'html', html: '<div class="po-subtitulo">Horario</div>' },
    { k: 'hi', label: 'Hora inicio', tipo: 'time', ancho: 'third' },
    { k: 'ht', label: 'Hora término', tipo: 'time', ancho: 'third', ayuda: 'Si es menor o igual al inicio, termina al día siguiente' },
    { k: 'hp', label: 'Hora presentación', tipo: 'time', ancho: 'third' },
    { k: 'lugar_presentacion', label: 'Lugar de presentación', ancho: 'half' },
    { k: 'turno', label: 'Turno', ancho: 'half', placeholder: 'Ej.: 1er turno' },
    { k: 'institucion', label: 'Institución(es) en el turno', ancho: 'half' },
  ];
  if (plan.etapas.length) campos.push({ k: 'etapa_id', label: 'Etapa', tipo: 'select', opciones: opcionesEtapas(), vacio: '— Sin etapa —', ancho: 'half' });
  campos.push(
    { k: 'hora_por_confirmar', tipo: 'check', textoCheck: 'Hora por confirmar (sin horas: cubre el día completo)' },
    { k: 'observaciones', label: 'Observaciones' },
  );
  PO.abrirFormulario({
    titulo: `Agregar servicios${f ? ' · ' + f.nombre : ' del plan'}`, ancho: 760,
    campos, valores: { modo: 'sueltas', etapa_id: f?.etapa_id || null },
    textoGuardar: 'Crear servicios',
    alGuardar: async v => {
      let dias = [];
      if (v.modo === 'sueltas') {
        const trozos = (v.fechas || '').split(/[\s,;]+/).filter(Boolean);
        for (const t of trozos) {
          const iso = PO.parseFechaCL(t);
          if (!iso) throw new Error(`Fecha no válida: "${t}". Use dd.mm.aaaa`);
          dias.push(iso);
        }
      } else {
        if (!v.desde || !v.hasta) throw new Error('Indique desde y hasta.');
        if (v.hasta < v.desde) throw new Error('"Hasta" es anterior a "Desde".');
        const filtro = (v.dias || []).map(d => ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].indexOf(d) + 1);
        for (let d = v.desde; d <= v.hasta; d = PO.sumarDias(d, 1)) {
          if (!filtro.length || filtro.includes(PO.diaSemana(d))) dias.push(d);
          if (dias.length > 400) throw new Error('Demasiadas fechas (máx. 400).');
        }
      }
      if (!dias.length) throw new Error('No hay fechas para crear.');
      if (!v.hi && !v.hora_por_confirmar) throw new Error('Indique la hora de inicio o marque "Hora por confirmar".');
      const filas = dias.map(d => {
        const hi = v.hi || '00:00';
        const ht = v.ht || (v.hi ? null : '23:59');
        const diaFin = ht && ht <= hi && v.hi ? PO.sumarDias(d, 1) : d;
        const diaPres = v.hp && v.hi && v.hp > v.hi ? PO.sumarDias(d, -1) : d;
        return {
          plan_id: plan.id, faccion_id: faccionId || null, etapa_id: v.etapa_id || null,
          inicio: PO.deInput(`${d}T${hi}`),
          termino: PO.deInput(`${diaFin}T${ht || hi}`),
          presentacion: v.hp ? PO.deInput(`${diaPres}T${v.hp}`) : null,
          lugar_presentacion: v.lugar_presentacion, turno: v.turno, institucion: v.institucion,
          hora_por_confirmar: !!v.hora_por_confirmar, observaciones: v.observaciones,
        };
      });
      await PO.guardarVarios('po_servicios', filas);
      SIGO.showToast(`✅ ${filas.length} servicio${filas.length > 1 ? 's' : ''} creado${filas.length > 1 ? 's' : ''}`);
      await recargar();
    },
  });
}

async function borrarServiciosFaccion(faccionId) {
  const lista = plan.servicios.filter(s => (s.faccion_id || null) === (faccionId || null));
  if (!lista.length || !confirm(`¿Eliminar los ${lista.length} servicios de esta sección?`)) return;
  const { error } = await SIGO.db.from('po_servicios').delete().in('id', lista.map(s => s.id));
  if (error) { SIGO.showToast('❌ ' + error.message, 'warning'); return; }
  await recargar();
}

        const etapa = p.etapas.find(e => e.id === f.etapa_id);
        return `<div class="po-faccion">
          <div class="po-faccion-head"><strong>${esc(f.nombre)}${etapa ? ` <span class="badge badge-asignada">${esc(etapa.nombre)}</span>` : ''}</strong>
            ${btnAdmin('✎ Editar', `editarFaccion('${f.id}')`)}${btnAdmin('✕', `borrarFila('po_facciones','${f.id}','la facción “${f.nombre.replace(/['"<>&\\]/g, '')}” con sus recursos y servicios')`, 'btn-link peligro')}</div>
          <div class="po-faccion-body">
            <div class="po-dl" style="margin-bottom:12px;">
              <div><span>Lugar</span>${val(f.lugar)}</div>
              <div><span>Unidad a cargo</span>${f.unidad_cargo_id ? esc(nombreUnidad(f.unidad_cargo_id)) : NE}</div>
              <div><span>Jefe de facción</span>${val(f.jefe_faccion)}</div>
              <div><span>Apoyo institucional</span>${(f.apoyo_instituciones || []).length || f.apoyo_detalle
                ? esc([(f.apoyo_instituciones || []).join(', '), f.apoyo_detalle].filter(Boolean).join(' · ')) : '<span class="text-muted">—</span>'}</div>
              ${f.observaciones ? `<div class="po-largo"><span>Observaciones</span>${esc(f.observaciones)}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;margin-bottom:4px;"><strong class="text-sm" style="flex:1;">Recursos</strong>
              ${btnAdmin('＋ Recursos de una unidad', `editarRecurso('${f.id}')`)}</div>
            ${tablaRecursos(f)}
            <div style="display:flex;align-items:center;margin:12px 0 4px;"><strong class="text-sm" style="flex:1;">Fechas y horarios (${sv.length})</strong>
              ${btnAdmin('＋ Servicios', `agregarServicios('${f.id}')`)}</div>
            ${tablaServicios(sv, f.id)}
          </div></div>`;
      }).join('') : `<div class="po-vacio">Sin facciones definidas.</div>`}
    </div></div>

    ${serviciosPlan.length || !p.facciones.length ? `<div class="card po-seccion"><div class="card-header"><h3>Servicios del plan (sin facción)</h3>
      ${btnAdmin('＋ Servicios', 'agregarServicios(null)', 'btn btn-outline btn-sm')}</div><div class="card-body">
      <p class="text-sm text-muted" style="margin-bottom:8px;">Para planes sin facciones (ej.: emergencias): define cuándo está vigente el servicio.</p>
      ${tablaServicios(serviciosPlan, null)}</div></div>` : ''}

    <div class="card po-seccion"><div class="card-header"><h3>Plazos</h3>
      ${btnAdmin('＋ Plazo', 'editarPlazo()', 'btn btn-outline btn-sm')}</div><div class="card-body">
      ${p.plazos.length ? `<div class="table-wrap"><table class="po-mini"><thead><tr><th>Tipo</th><th>Vence</th><th>Situación</th><th>Destinatario / formato</th><th>NCU cumplimiento</th><th class="po-solo-admin"></th></tr></thead><tbody>
        ${p.plazos.map(z => {
          const s = PO.semaforoPlazo(z, ahora);
          return `<tr><td><strong>${PO.PLAZO_TIPOS[z.tipo]}</strong>${z.descripcion ? `<div class="po-sub" style="white-space:normal;max-width:320px;">${esc(z.descripcion)}</div>` : ''}</td>
            <td>${z.vence ? PO.fFechaHora(z.vence) : NE}${z.al_termino_servicio ? '<div class="po-sub">Al término del servicio</div>' : ''}</td>
            <td><span class="badge ${s.cls}">${s.texto}</span></td>
            <td style="white-space:normal;">${esc([z.destinatario, z.formato].filter(Boolean).join(' · ')) || '<span class="text-muted">—</span>'}</td>
            <td>${esc(z.ncu_cumplimiento || '')}</td>
            <td class="po-solo-admin">${btnAdmin(z.estado === 'cumplido' ? '↺' : '✅', `cumplirPlazo('${z.id}')`)}${btnAdmin('✎', `editarPlazo('${z.id}')`)}${btnAdmin('✕', `borrarFila('po_plazos','${z.id}','este plazo')`, 'btn-link peligro')}</td></tr>`;
        }).join('')}
      </tbody></table></div>` : '<div class="po-vacio">Sin plazos registrados.</div>'}
    </div></div>

    <div class="card po-seccion"><div class="card-header"><h3>Indicadores personalizados</h3>
      ${btnAdmin('＋ Indicador', 'editarIndicador()', 'btn btn-outline btn-sm')}</div><div class="card-body">
      ${p.indicadores.length ? `<div class="table-wrap"><table class="po-mini"><thead><tr><th>Indicador</th><th>Tipo</th><th>Cálculo</th><th class="po-solo-admin"></th></tr></thead><tbody>
        ${p.indicadores.map(x => `<tr><td><strong>${esc(x.nombre)}</strong>${x.descripcion ? `<div class="po-sub">${esc(x.descripcion)}</div>` : ''}</td>
          <td>${x.tipo === 'porcentaje' ? 'Porcentaje' : 'Número'}</td>
          <td style="white-space:normal;">${x.tipo === 'porcentaje' ? `${val(x.numerador)} / ${val(x.denominador)}` : '<span class="text-muted">—</span>'}</td>
          <td class="po-solo-admin">${btnAdmin('✎', `editarIndicador('${x.id}')`)}${btnAdmin('✕', `borrarFila('po_indicadores','${x.id}','este indicador')`, 'btn-link peligro')}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="po-vacio">Sin indicadores personalizados. Los indicadores estándar de labor se registran siempre.</div>'}
    </div></div>

    <div class="card po-seccion po-solo-admin"><div class="card-header"><h3>Historial de cambios</h3>
      <button class="btn btn-outline btn-sm" onclick="verAuditoria(this)">Ver auditoría</button></div>
      <div class="card-body" id="auditoria"><div class="po-vacio">Registro de creación, edición, confirmación y borrado de este plan.</div></div></div>
  `;
}

async function verAuditoria(btn) {
  btn.disabled = true;
  const [{ data, error }, usuarios] = await Promise.all([
    SIGO.db.from('po_auditoria').select('*').eq('plan_id', plan.id).order('en', { ascending: false }).limit(60),
    SIGO.getUsuarios().catch(() => []),
  ]);
  const el = document.getElementById('auditoria');
  if (error) { el.innerHTML = `<div class="alert alert-warning">${esc(error.message)}</div>`; return; }
  const nombre = id => usuarios.find(u => u.id === id)?.nombre || (id ? 'Usuario' : 'Sistema / SQL');
  const TABLAS = { po_planes: 'Plan', po_ncu: 'NCU', po_etapas: 'Etapa', po_facciones: 'Facción', po_recursos: 'Recursos',
    po_servicios: 'Servicio', po_plazos: 'Plazo', po_contradicciones: 'Contradicción', po_indicadores: 'Indicador', po_labor: 'Labor' };
  const ACC = { insert: 'Creación', update: 'Edición', delete: 'Borrado', confirmacion: 'Confirmación' };
  el.innerHTML = data.length ? `<div class="table-wrap"><table class="po-mini"><thead><tr><th>Fecha</th><th>Usuario</th><th>Elemento</th><th>Acción</th></tr></thead><tbody>
    ${data.map(a => `<tr><td>${PO.fFechaHora(a.en)}</td><td>${esc(nombre(a.usuario_id))}</td><td>${TABLAS[a.tabla] || a.tabla}</td><td>${ACC[a.accion] || a.accion}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="po-vacio">Sin registros.</div>';
}

async function recargar() {
  plan = await PO.obtenerPlan(plan.id);
  render();
}

async function init() {
  ctx = await PO.iniciarPagina();
  if (!ctx) return;
  try {
    unidades = await PO.unidades();
    if (params.get('nuevo')) {
      if (!ctx.esAdmin) { location.replace('planes.html'); return; }
      document.getElementById('ficha').innerHTML = `<div class="card" style="padding:30px;text-align:center;">
        <p style="margin-bottom:12px;">Ingrese los datos del nuevo plan.</p>
        <button class="btn btn-primary" onclick="formularioNuevo()">＋ Abrir formulario</button>
        <a class="btn btn-outline" href="planes.html">Volver</a></div>`;
      formularioNuevo();
      return;
    }
    const id = params.get('id');
    if (!id) { location.replace('planes.html'); return; }
    plan = await PO.obtenerPlan(id);
    render();
    if (params.get('adicion') && ctx.esAdmin) {
      registrarAdicion({ ncu: params.get('ncu'), fecha: params.get('fecha'), resumen: params.get('resumen') });
    }
  } catch (e) {
    document.getElementById('ficha').innerHTML = `<div class="alert alert-warning">⚠️ No se pudo cargar el plan: ${esc(e.message)}</div>
      <a class="btn btn-outline" href="planes.html">Volver a la lista</a>`;
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
